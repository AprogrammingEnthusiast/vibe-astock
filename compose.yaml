services:
  app:
    build: .
    ports:
      - "127.0.0.1:${VIBE_PORT:-8910}:8910"
    env_file:
      - path: .env
        required: false
    environment:
      VIBE_ALLOW_UNSAFE_CLI: ${VIBE_ALLOW_UNSAFE_CLI-codex}
      VIBE_LLM_CLI: ${VIBE_LLM_CLI-codex}
    volumes:
      - app-data:/home/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8910/api/health', timeout=5))['ok']"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  app-data:
